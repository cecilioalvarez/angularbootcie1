<form>
    <div class="mb-3">
        <label for="isbn" class="form-label">ISBN</label>
        <input type="text" class="form-control" id="isbn" name="isbn" [(ngModel)]="libro.isbn" placeholder="Ingrese el ISBN" required>
    </div>
    <div>
        <label for="titulo" class="form-label">Titulo</label>
        <input type="text" class="form-control" id="titulo" name="titulo" [(ngModel)]="libro.titulo" placeholder="Ingrese el Titulo" required>
    </div>
    <div>
        <label for="autor" class="form-label">Autor</label>
        <input type="text" class="form-control" id="autor" name="autor" [(ngModel)]="libro.autor" placeholder="Ingrese el Autor" required>
    </div>
    <div>
        <label for="paginas" class="form-label">Paginas</label>
        <input type="number" class="form-control" id="paginas" name="paginas" [(ngModel)]="libro.paginas" placeholder="Ingrese las Paginas" required>
    </div>
    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success" (click)="insertar()">Guardar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
    </div>
</form>
